# 继承基础配置
INHERIT: mkdocs_base.yml
site_name: "[CHIP_NAME] 开发者中心"
site_url: https://docs.example.com/projects/your-chip/master/

site_description: Documentation template for the [CHIP_NAME] platform
site_author: Your Company

repo_name: 前往GitCode编辑
repo_url: https://gitcode.com/YourOrg/YourRepo
edit_uri: edit/main/docs/

copyright: >
  Documentation © 2026 Your Company contributors —
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>

# 语言配置
plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh-CN
          name: 中文
          default: true
          link: /
          site_name: "[CHIP_NAME] 开发者中心"
          theme:
            language: zh
  - search:
      lang:
        - zh

extra:
  # 版本下拉框配置
  version_selector:
    repo_path: your_repo
    version: master


