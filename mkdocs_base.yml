hooks:
  - hooks/_fix_heading_levels.py  # 修复IDP文档标题层级问题
  - hooks/_strip_md_links.py  # 移除IDP文档中的无效MD链接
  - hooks/_slugify.py  # 自定义 toc 锚点 slugify（仅空格转-，其余原样）
  - hooks/_slugify_links.py  # 自动规整正文锚点链接 fragment（与标题 id 规则同步）
  - hooks/_external_links.py  # 外部链接自动新标签页打开并补 rel=noopener noreferrer
  - hooks/_homepage.py  # 将指定md文件转换为首页（默认首页为index.md）

markdown_extensions:
  - nl2br
  - abbr
  - admonition
  - tables
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      # permalink: true  # 标题右侧锚点生成开关
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {}  # 支持中文标题生成锚点
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      # auto_title: true  # 显示代码块语言标签
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols:
      fractions: false  # 关闭自动分数替换（1/2→½），避免误伤 QoS 0/1/2 等文本
  - pymdownx.caret
  - pymdownx.critic
#   - pymdownx.betterem:
#       smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.magiclink

