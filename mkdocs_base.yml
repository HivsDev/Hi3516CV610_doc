use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  favicon: static/images/favicon.ico
  # language is set dynamically by the i18n plugin
  # 启用主题切换
  palette:
    - scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色主题
    - scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色主题
  # font:
  #   text: Helvetica Neue, PingFang SC, Microsoft YaHei
  #   code: Consolas, Roboto Mono
  features:
    - announce.dismiss
    # - content.action.edit  # 上传开源仓后再开启
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.instant          # SPA 无刷新导航（仅 zh-CN 时与 i18n 无冲突）
    - navigation.instant.progress # 导航时显示进度条，掩盖内容交换的白屏闪烁
    - navigation.instant.preview  # 鼠标悬停预加载，点击瞬间完成交换
    - navigation.tracking         # update URL on scroll
    # - navigation.tabs          # 第一级目录横向展示
    # - navigation.tabs.sticky   # 开启后导致右侧菜单选中效果异常
    # - navigation.sections         # sections in side nav
    # - navigation.expand           # expand sidebar sections (disabled; use JS expandNavToLevel2 instead)
    - navigation.indexes          # section index pages
    - navigation.top              # back-to-top button
    - navigation.footer
    - navigation.path             # breadcrumbs
    # - navigation.prune            # smaller nav payload (disabled to allow full nav expansion)
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    edit: fontawesome/solid/edit

